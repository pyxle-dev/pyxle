[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[project]
name = "pyxle-framework"
version = "0.9.2"
description = "Python-first full-stack framework with an intelligent CLI."
readme = "README.md"
authors = [
  { name = "Shivam Saini", email = "dev@pyxle.dev" }
]
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
keywords = ["web framework", "full-stack", "react", "ssr", "python"]
dependencies = [
  "typer>=0.12",
  "starlette>=1.3.1,<2.0",
  "httpx>=0.27,<0.29",
  "uvicorn[standard]>=0.29,<1.0",
  "watchdog>=4.0,<7.0",
  # python-multipart powers Starlette's ``request.form()`` parser. Required
  # so the CSRF middleware can validate ``_csrf_token`` form fields and so
  # ``@action`` handlers can accept progressively-enhanced ``<Form>`` POSTs
  # (no-JS submissions sending ``application/x-www-form-urlencoded`` /
  # ``multipart/form-data``). Without it Starlette raises ``AssertionError``
  # the first time form parsing is attempted.
  "python-multipart>=0.0.9,<1.0",
  # pyflakes powers the semantic layer of ``pyxle check`` (undefined names,
  # unused imports, redefinitions) beyond the parser's syntax check. Tiny and
  # pure-Python with zero transitive dependencies; imported lazily so it only
  # loads for ``pyxle check``, never on the compile/serve hot path.
  "pyflakes>=3.1,<4.0",
  # pyxle-langkit ships the self-contained JSX component extractor that powers
  # the JSX layer of ``pyxle check``. It is a default dependency so ``check``
  # works out of the box on a fresh install — previously it exited 1 on a
  # brand-new scaffold unless the undocumented ``[langkit]`` extra was
  # installed (the top pre-launch QA finding). Honest note: this is a
  # deliberate dependency cycle — pyxle-langkit declares
  # ``pyxle-framework>=0.1.0``. pip and uv resolve published cycles fine, and
  # the cycle was chosen over vendoring the extractor into this package, which
  # would inevitably drift from the langkit source of truth. The module
  # boundary holds: langkit only imports ``pyxle.compiler``.
  "pyxle-langkit>=0.3.4,<0.4",
  # questionary renders the interactive ``pyxle init`` prompts (arrow-key
  # Yes/No selections with a highlighted default, instead of bare text input).
  # Built on prompt_toolkit; imported lazily on the prompt path only, so it
  # never loads on the compile/serve hot path.
  "questionary>=2.0,<3.0",
  # debugpy powers ``pyxle dev --inspect`` — breakpoint debugging of .pyxl
  # files from VS Code (or any DAP client). A default dependency because
  # debugging is core DX that nearly every developer reaches for; imported
  # lazily on the ``--inspect`` path only, so it never loads on the normal
  # compile/serve/dev hot path.
  "debugpy>=1.8,<2.0",
]

[project.urls]
Homepage = "https://pyxle.dev"
Repository = "https://github.com/pyxle-dev/pyxle"
Documentation = "https://pyxle.dev/docs/"
"Bug Tracker" = "https://github.com/pyxle-dev/pyxle/issues"
PyPI = "https://pypi.org/project/pyxle-framework/"

[project.optional-dependencies]
# Redundant since 0.7.0 — pyxle-langkit is now a default dependency (see
# [project] dependencies). Kept so existing installs and docs referencing
# ``pyxle-framework[langkit]`` keep working; the floor matches the default dep.
langkit = [
  "pyxle-langkit>=0.3.4,<0.4",
  # questionary renders the interactive ``pyxle init`` prompts (arrow-key
  # Yes/No selections with a highlighted default, instead of bare text input).
  # Built on prompt_toolkit; imported lazily on the prompt path only, so it
  # never loads on the compile/serve hot path.
  "questionary>=2.0,<3.0",
]
# Shared Redis backends — the server-side page cache
# (PYXLE_PAGE_CACHE_BACKEND=redis) and the cross-worker realtime broker
# (PYXLE_REALTIME_BROKER=redis). Optional — the in-memory/file page cache and the
# in-process realtime broker (the defaults) need nothing extra.
redis = [
  "redis>=5.0,<9.0",
]
# Request-body validation on @action via Pydantic models, and OpenAPI schema
# generation (`pyxle openapi`). Optional — actions without a Pydantic-typed
# `body` parameter need nothing extra.
pydantic = [
  "pydantic>=2.0,<3.0",
]
# Nicer structured logging (JSON/console) for the observability access log.
# Optional — without it Pyxle falls back to a stdlib JSON/console formatter, so
# structured logging works either way.
observability = [
  "structlog>=24.1,<27.0",
]
# OpenTelemetry distributed tracing (observability.otel). A separate extra so a
# logs-only install doesn't pull the OTel SDK. Off by default; without it,
# tracing is a no-op.
observability-otel = [
  "opentelemetry-sdk>=1.20,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.20,<2.0",
]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-cov>=4.1,<8.0",
  "coverage>=7.4,<8.0",
  "ruff>=0.6,<0.17",
  "pydantic>=2.0,<3.0",
  # The CLI tests use CliRunner.isolated_filesystem, which a newer Typer (and
  # Click 8.2) dropped. Pin both to the validated range. Test-only constraint —
  # the package's runtime deps are unaffected.
  "typer>=0.12,<0.13",
  "click>=8.1,<8.2",
]

[project.scripts]
pyxle = "pyxle.cli:app"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pyxle"]

[tool.ruff.lint]
# Pin the rule set explicitly.
#
# Until now this project declared no ``select`` at all, so its lint contract was
# implicitly "whatever ruff happens to default to". Ruff 0.16 expanded that
# default from four prefixes (E4, E7, E9, F) to roughly thirty-seven rule
# families — pyupgrade, isort, bugbear, flake8-bandit, pylint and more — which
# turned 853 pre-existing findings into a CI failure overnight without a single
# line of this codebase changing. Declaring ``select`` here makes the contract
# explicit and version-independent, so a future ruff bump can no longer
# silently redefine what "green" means.
#
# The pinned set is exactly what this codebase has been written and reviewed
# against since day one (ruff's pre-0.16 default), and it passes clean.
# Broadening it is worth doing, but as a deliberate, reviewable change of its
# own: all 853 findings were triaged and none was a defect — they are style and
# idiom modernisation (annotation syntax, import ordering, comprehensions),
# which does not belong in a dependency bump.
select = ["E4", "E7", "E9", "F", "ASYNC"]

# ``ASYNC`` is the one family added beyond ruff's pre-0.16 default, and it is
# added deliberately rather than as a step toward broadening (see D-014, which
# defers that to its own reviewable PR). It costs **zero** findings across
# ``pyxle/`` today and it guards CLAUDE.md §8 — blocking HTTP calls, ``open()``,
# ``time.sleep()`` and subprocesses inside ``async`` functions — a class that has
# already bitten us once on the SSR hot path.
#
# It does *not* catch that specific defect: ``ASYNC240`` (blocking ``Path``
# methods) does not exist in ruff 0.6.9. Catching it needs the version bump, which
# is P2-12. The regression tests asserting zero ``Path.resolve()`` calls per warm
# render are the version-independent guard in the meantime.

[tool.ruff.lint.per-file-ignores]
# Bounded poll loops already wrapped in ``asyncio.wait_for``. ASYNC110 suggests
# an ``anyio.Event``, which does not apply to waiting on a subprocess this test
# controls. Scoped to the one file rather than exempting ``tests/`` wholesale, so
# the rule still guards test code everywhere else.
"tests/devserver/test_vite.py" = ["ASYNC110"]

[tool.coverage.run]
branch = true
source = ["pyxle/cli", "pyxle/compiler", "pyxle/devserver", "pyxle/ssr", "pyxle/security.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=pyxle.build --cov=pyxle.cli --cov=pyxle.compiler --cov=pyxle.devserver --cov=pyxle.ssr --cov=pyxle.security --cov=pyxle.cache --cov=pyxle.realtime --cov=pyxle.observability --cov=pyxle.tasks --cov=pyxle.middleware --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
# pytest's default ``norecursedirs`` skips any directory literally named
# ``build`` — which silently drops ``tests/build`` (the test package mirroring
# the ``pyxle/build`` source package) during recursion. Re-declare the defaults
# *without* ``build`` so those tests run in CI. Real build artifacts live under
# dot-dirs (``.pyxle-build``, matched by ``.*``) and ``dist``, still excluded.
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]
