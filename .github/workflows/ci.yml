name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check pyxle/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Run every version even if one fails, so a single incompatibility
      # doesn't hide the status of the others.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout pyxle
        uses: actions/checkout@v7
        with:
          path: pyxle

      # The JSX component extractor (Script / Image / <Head> detection) lives in
      # the sibling pyxle-langkit repo and is resolved relative to the pyxle
      # checkout (../pyxle-langkit). Checking it out as a sibling — and npm
      # installing its @babel deps — is what lets the compiler/SSR head tests run
      # (otherwise the extractor isn't found and returns no declarations).
      - name: Checkout pyxle-langkit (sibling, for the JSX extractor)
        uses: actions/checkout@v7
        with:
          repository: pyxle-dev/pyxle-langkit
          path: pyxle-langkit

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Node is required: the JSX extractor runs Babel, and the SSR renderer
      # tests shell out to esbuild + React (provisioned into a local cache).
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install JSX extractor deps (Babel)
        run: npm install
        working-directory: pyxle-langkit

      - name: Install dev dependencies
        run: pip install -e ".[dev]"
        working-directory: pyxle

      # pytest config in pyproject.toml runs the suite with coverage and
      # enforces the 95% gate (--cov-fail-under). No extra flags needed.
      - name: Run test suite (with coverage gate)
        run: pytest
        working-directory: pyxle

  test-windows:
    name: Test (Windows, cross-platform surface)
    runs-on: windows-latest
    steps:
      - name: Checkout pyxle
        uses: actions/checkout@v7
        with:
          path: pyxle

      - name: Checkout pyxle-langkit (sibling, for the JSX extractor)
        uses: actions/checkout@v7
        with:
          repository: pyxle-dev/pyxle-langkit
          path: pyxle-langkit

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install JSX extractor deps (Babel)
        run: npm install
        working-directory: pyxle-langkit

      - name: Install dev dependencies
        run: pip install -e ".[dev]"
        working-directory: pyxle

      # Exercise the code with genuine OS-specific behaviour on Windows —
      # signal-death exit codes, os.path.relpath across drives, atomic
      # os.replace under lock contention, POSIX/Windows path handling in the
      # line-map footer + source-map sidecar, the discovery file, and Studio.
      # (A full-suite Windows matrix is a good follow-up; this pins the paths
      # this feature is most likely to break on Windows.)
      - name: Run cross-platform test surface
        run: >
          pytest --no-cov
          tests/compiler/test_linemap.py
          tests/compiler/test_writers.py
          tests/devserver/test_debug_import.py
          tests/devserver/test_vite.py
          tests/devserver/test_studio.py
          tests/devserver/test_devserver_start.py
          tests/devserver/test_proxy.py
          tests/build/test_pipeline.py
          tests/cli/test_commands.py
          tests/test_main.py
        working-directory: pyxle
